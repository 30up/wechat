name: 每日A股盘后报告推送
on:
  schedule:
    # cron使用UTC时间，北京时间15:40 = UTC 07:40，只周一至周五运行
    - cron: '40 7 * * 1-5'
  workflow_dispatch: # 允许网页手动点击测试运行
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare requests pandas chinese-calendar
      - name: Run stock report script
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
        run: |
          python main.py
